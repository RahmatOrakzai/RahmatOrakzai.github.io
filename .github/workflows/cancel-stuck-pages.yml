name: Cancel stuck Pages deployment

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel orphaned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/c5df63baa8ea64fda7df43cae706b5b4a1dcc181/cancel"
